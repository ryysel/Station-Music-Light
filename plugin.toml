id = "airplay.music-light"
name = "Свет Яндекс Музыки"
version = "0.1.0-rc.1"
description = "Кольцо Мини 2 принимает цвет обложки и пульсирует в такт штатной музыке."
entry = "bin/music-light"
permissions = ["exec", "led", "ipc.speech"]

[launch]
kind = "binary"
mode = "service"
path = "bin/music-light"

[compatibility]
models = ["yandexmini_2"]
features = ["led.ring.rgb", "led.ring.6", "led.color.logical-rgb.v1"]
