id = "airplay.music-light"
name = "Свет Яндекс Музыки"
version = "0.1.0-rc.2"
description = "Подсветка станции принимает цвет обложки и пульсирует в такт штатной музыке."
entry = "bin/music-light"
permissions = ["exec", "led", "ipc.speech"]

[launch]
kind = "binary"
mode = "service"
path = "bin/music-light"

[compatibility]
models = ["bergamot", "cucumber", "mango", "plum", "yandexmicro", "yandexmidi", "yandexmini", "yandexmini_2", "yandexplum", "yandexstation_2", "yandexmini3", "YandexStationMini"]
features = []
