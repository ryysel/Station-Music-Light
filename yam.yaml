name: airplay/music-light
version: 0.1.0
license: MIT
homepage: https://github.com/ryysel/Station-Music-Light
description: Подсветка кольца под обложку и ритм штатной Яндекс Музыки на станциях с RGB-индикацией.
targets: ["bergamot", "cucumber", "mango", "plum", "yandexmicro", "yandexmidi", "yandexmini", "yandexmini_2", "yandexplum", "yandexstation_2"]
depends: ["yam/luna >=0.2.32"]
files:
  share/luna/plugins/airplay.music-light/plugin.toml: plugin.toml
  share/luna/plugins/airplay.music-light/bin/music-light: build/$YAM_TRIPLE/music-light
  share/luna/plugins/airplay.music-light/licenses/: licenses/
  share/luna/plugins/airplay.music-light/LICENSE: LICENSE
